[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kippu"
version = "0.1.0"
description = "Kiosco local de captura, mapeo corporal e impresión para Windows y Linux"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "opencv-python>=4.8",
    "mediapipe>=0.10",
    "Pillow>=10.0",
    "pywin32>=306; platform_system == 'Windows'",
    "tomli>=2.0; python_version < '3.11'",
]

[project.scripts]
kippu = "kippu.__main__:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
